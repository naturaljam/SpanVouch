[project]
name = "spanvouch"
version = "0.7.0"
description = "Trace diagnosis and regression infrastructure for tool-using agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "autogen-agentchat>=0.7,<0.8",
  "autogen-core>=0.7,<0.8",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<2",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
spanvouch = "spanvouch.cli.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanvouch"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spanvouch"]
